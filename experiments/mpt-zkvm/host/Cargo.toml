[package]
name = "host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "mpt"
path = "src/main.rs"

[dependencies]
methods = { path = "../methods" }
mpt-core = { path = "../core" }
# Default features: the executor in-process, proving through the installed `r0vm` (3.0.x). Build
# r0vm with CUDA or Metal to prove on a GPU; this crate doesn't change.
risc0-zkvm = "=3.0.5"
# The circuits and verifier at the versions LEZ v0.4.0-rc1 locks. risc0-zkvm 3.0.5 alone resolves
# risc0-circuit-recursion 4.1.0, whose verifier parameters (f57f355f…) refuse the receipts r0vm 3.0.5
# produces (ece5e9b8…). Not used directly; they only hold the resolution, so no default features
# (recursion's and keccak's turn on proving, which builds GPU kernels).
risc0-circuit-recursion = { version = "=4.0.4", default-features = false }
risc0-circuit-rv32im = { version = "=4.0.4", default-features = false }
risc0-circuit-keccak = { version = "=4.0.5", default-features = false }
risc0-zkp = { version = "=3.0.4", default-features = false }
risc0-binfmt = { version = "=3.0.4", default-features = false }
risc0-groth16 = { version = "=3.0.4", default-features = false }
alloy-rlp = "0.3"
alloy-trie = "0.9"
anyhow = "1"
bincode = "1.3"
borsh = { version = "1.5", features = ["derive"] }
serde_json = "1"
