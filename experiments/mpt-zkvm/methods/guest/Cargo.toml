# The guest: only ever built for riscv32im-risc0-zkvm-elf, so it is its own workspace and its
# patches don't reach the host.
[workspace]

[package]
name = "mpt"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
mpt-core = { path = "../../core" }
borsh = { version = "1.5", features = ["derive"] }
# `unstable` for the accelerators. Pinned to the version LEZ v0.4.0-rc1 and eth_lc build against,
# so the cycles are comparable with what LEZ meters.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "unstable"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# RISC Zero's accelerated Keccak, as eth_lc uses. Without it every trie node hashes in software,
# at several times the cycles (eth_lc's storage attestation: 2.03M cycles before, 0.30M after).
[patch.crates-io]
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
